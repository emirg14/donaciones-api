name: CI/CD - donaciones-api

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/donaciones-api

jobs:
  # ---------------------------------------------------------------- CI
  calidad:
    name: Lint + pruebas unitarias (Jest, cobertura >= 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Pruebas + cobertura (falla si < 80 %)
        run: npm run test:ci

      - name: Auditoría de dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;
          const f=k=>'| '+k+' | '+s[k].pct+' % |';
          console.log(['### Cobertura de pruebas','| Métrica | % |','|---|---|',f('statements'),f('branches'),f('functions'),f('lines')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-y-junit
          path: |
            coverage/
            reports/junit.xml

  sonarqube:
    name: Análisis estático (SonarQube)
    needs: calidad
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-y-junit
      - name: Escaneo SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
      - name: Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
      - name: Aviso si no hay SonarQube configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Configura los secretos SONAR_TOKEN y SONAR_HOST_URL para habilitar el análisis."

  # ---------------------------------------------------------------- CD
  imagen:
    name: Construir y publicar imagen Docker
    needs: calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging

  desplegar-pruebas:
    name: Desplegar en entorno de prueba (staging) + OWASP ZAP
    needs: [imagen, sonarqube]
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Opción A: disparar el despliegue en un servicio externo (Render, Railway, etc.)
      - name: Desplegar en Render (si existe el deploy hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      # Opción B (siempre): levantar la imagen publicada como entorno de prueba efímero
      - name: Levantar contenedor de staging
        run: |
          JWT_SECRET="${JWT_SECRET:-$(openssl rand -hex 32)}"
          ADMIN_PASSWORD="${ADMIN_PASSWORD:-Staging$(openssl rand -hex 6)A1}"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name staging -p 3000:3000 \
            -e NODE_ENV=production -e JWT_SECRET="$JWT_SECRET" \
            -e ADMIN_EMAIL=admin@donaciones.mx -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e RATE_LIMIT_MAX=5000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && break; sleep 2; done

      - name: Pruebas de humo (smoke tests)
        run: |
          set -e
          curl -fsS -X POST http://localhost:3000/api/auth/registro -H 'Content-Type: application/json' \
            -d '{"nombre":"Donante Smoke","email":"smoke@donaciones.mx","password":"SmokeTest2026"}'
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@donaciones.mx\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -fsS http://localhost:3000/api/donantes -H "Authorization: Bearer $TOKEN" | jq .total

      - name: Escaneo OWASP ZAP (API scan con OpenAPI)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host \
            -v "$PWD/docs:/zap/wrk/docs:ro" -v "$PWD/zap:/zap/wrk/zap:ro" -v "$PWD/zap-out:/zap/wrk/out" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
              -t /zap/wrk/docs/openapi.yaml -f openapi -O http://localhost:3000 \
              -c zap/rules.tsv -r out/zap-reporte.html -J out/zap-reporte.json -a || code=$?
          # 0 = sin alertas, 2 = solo advertencias; 1 = alertas FAIL (se detiene el pipeline)
          if [ "${code:-0}" = "1" ] || [ "${code:-0}" -gt 2 ]; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-owasp-zap
          path: zap-out/

      - name: Logs del contenedor
        if: always()
        run: docker logs staging || true
